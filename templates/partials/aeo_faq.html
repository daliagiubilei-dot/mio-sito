{% if faqs %}
<section class="block" style="padding-top:8px">
  <div class="wrap"><div style="max-width:860px">
    <p class="label">Domande frequenti</p>
    <h2 style="font-size:clamp(1.5rem,3vw,2rem);margin:10px 0 18px">{{ faq_title or 'Le risposte che cerchi' }}</h2>
    <div class="faq-panel">
      {% for f in faqs %}<details name="faq-block"{% if loop.first %} open{% endif %}><summary>{{ f.question }}</summary><div class="ans"><p>{{ f.answer }}</p></div></details>
      {% endfor %}
    </div>
  </div></div>
</section>
{% endif %}
