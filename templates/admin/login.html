<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Accesso – Daliamae</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head>
<body><div class="login card">
<h1>Pannello Daliamae</h1>
{% if disabled %}
<p class="sub">Il pannello non è ancora attivo: aggiungi la variabile <b>ADMIN_PASSWORD</b> alle variabili del servizio su Railway e riavvia.</p>
{% else %}
<p class="sub">Accedi per gestire SEO, AEO, blog, video ed eventi.</p>
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="u">Nome utente</label><input id="u" type="text" name="username" autocomplete="username" required>
  <label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required>
  <p><button class="btn" type="submit" style="margin-top:18px">Entra</button></p>
</form>
{% endif %}
</div></body></html>
